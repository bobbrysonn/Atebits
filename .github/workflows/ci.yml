name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # assembleRelease (not debug) is deliberate: it runs R8, which is the
      # only thing that catches minification silently breaking
      # kotlinx-serialization (see CLAUDE.md). No keystore in PR builds, so
      # this falls back to debug signing — that's fine, it's a compile check.
      - name: Build, lint, and test
        run: ./gradlew assembleRelease lintDebug testDebugUnitTest
